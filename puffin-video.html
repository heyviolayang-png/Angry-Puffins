function moose(t){
  g.save();g.translate(150,375);g.scale(.9,.9);

  ell(-3,-2,4,8,'#4a2f1d',-.5);ell(-3,-2,2,5,'#a77','-.5');            // ear

    g.beginPath();g.moveTo(d*12,-20);g.lineTo(d*24,-24);g.lineTo(d*30,-18);g.lineTo(d*26,-12);g.lineTo(d*18,-10);g.closePath();g.fill();
    for(let k=0;k<4;k++){g.beginPath();g.moveTo(d*(22+k*2),-24+k*3);g.lineTo(d*(25+k*3),-31+k*2);g.stroke();}
  }

  g.restore();
}const WHALES=[[8,6.5,700],[28,7,880],[50,6.5,560],[74,6.5,820]];   // [start, duration, x]
function whaleSwim(t,t0,dur,x0){

  g.translate(x,y);g.rotate(Math.atan2(-Math.cos(Math.PI*k)*Math.PI*170,dx));g.scale(1.25,1.25);
  ell(0,0,62,22,'#34506b');ell(6,8,52,12,'#9fb6c9');                    // body + pale belly
  g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=1.5;for(let i=0;i<5;i++){g.beginPath();g.moveTo(-6+i*9,2);g.lineTo(-8+i*9,16);g.stroke();} // throat grooves

  g.fillStyle='#c9d8e4';g.beginPath();g.moveTo(-82,-3);g.quadraticCurveTo(-94,-8,-102,-26);g.quadraticCurveTo(-96,-12,-92,-2);
  g.quadraticCurveTo(-96,9,-103,22);g.quadraticCurveTo(-92,8,-82,3);g.closePath();g.fill();               // pale underside
  g.strokeStyle='#8ea4b8';g.lineWidth=1.2;g.beginPath();g.moveTo(-82,0);g.lineTo(-100,-22);g.moveTo(-82,0);g.lineTo(-101,18);g.stroke(); // veins
  for(const [fx,fy] of [[-96,-14],[-92,-8],[-97,10],[-94,5]])ell(fx,fy,1.6,1.2,'#5d7389');                 // dark markings

  g.strokeStyle='rgba(255,255,255,.25)';g.lineWidth=1.5;g.beginPath();g.moveTo(-40,-14);g.quadraticCurveTo(-10,-24,20,-16);g.stroke(); // wet shine
  ell(34,-2,2.6,2.6,'#0b1520');ell(35,-3,.9,.9,'#fff');                  // eye

  const fa=k<.15?k/.15:(k>1?Math.max(0,1-(k-1)/.25):1);

}
function whales(t){for(const w of WHALES)whaleSwim(t,w[0],w[1],w[2]);}function burrow(x){ell(x,562,52,18,'#6a4a2c');ell(x,556,46,13,'#7d5a36');ell(x,558,30,10,'#150c07');ell(x,556,26,8,'#050302');}

function drawScene(t){
  let mood=0; if(t>=72&&t<84) mood=prog(t,72,76); else if(t>=84) mood=1;
  background(t,mood);
  const yG=420; // ground line for standing characters on cliff top (left cliff)
  // flat ledge for characters
  ell(245,555,44,10,'#b99a5a');   // nest
  burrow(110);burrow(380);   // burrows the puffins dug

  if(t<10){                                  // title: puffin and gull face off
    puffin(260,462,1.4,{flip:false,bob:Math.sin(t*3)*3,angry:t>5});
    gull(700,150+Math.sin(t*2)*20,1.4,{flip:true,ph:t});
  }
  else if(t<24){                             // meet puffins
    const k=t-10;
    puffin(110,470,1.3,{bob:Math.sin(t*3)*3});
    puffin(380,470,1.3,{flip:true,bob:Math.sin(t*3+1)*3});
    egg(245,532,1.1,Math.sin(t*2)*.04);
    if(k>7){chick(245,538,1,Math.sin(t*6)*3);}
    if(k>3&&k<7)bubble('One egg a year!',245,300);
    if(k>9&&k<13)bubble('Hello, puffling!',245,300);
  }
  else if(t<40){                             // seagulls bully the puffins -> puffins hide in their burrows
    const hideL=prog(t,29.6,30.6)*(1-prog(t,36.4,37.4)*.4), hideR=prog(t,33.4,34.4)*(1-prog(t,37,38)*.4);
    const pk=(t>=36.4)?1:0;
    egg(245,532,1.1);
    for(const [bx,hh,fl] of [[110,hideL,false],[380,hideR,true]]){
      g.save();g.beginPath();g.rect(0,0,W,556);g.clip();
      puffin(bx,470+hh*180,1.3,{flip:fl,angry:hh>.5,bob:hh>0?0:Math.sin(t*3)*3});
      g.restore();
      burrowLip(bx);
    }
    function gp(kf,tt){let a=kf[0],b=kf[kf.length-1];for(let q=0;q<kf.length-1;q++){if(tt>=kf[q][0]&&tt<=kf[q+1][0]){a=kf[q];b=kf[q+1];break;}}
      const u=ease(clamp((tt-a[0])/(b[0]-a[0]||1)));return [lerp(a[1],b[1],u),lerp(a[2],b[2],u)];}
    const A=[[24,1450,120],[28,760,200],[30.2,200,395],[32,520,170],[35,300,410],[37,700,150],[40,1100,130]];
    const B=[[28,1500,150],[32,900,220],[33.8,430,405],[35.5,800,160],[38,500,260],[40,900,200]];
    for(const kf of [A,B]){ if(t<kf[0][0])continue;
      const [gx,gy]=gp(kf,t),[nx]=gp(kf,t+.15); gull(gx,gy+Math.sin(t*3)*5,1.5,{flip:nx<gx,ph:t*1.4}); }
    if(t>29&&t<32)bubble('Eek!',150,330);
    if(t>33&&t<35.5)bubble('Hide!',420,330);
    if(t>31&&t<35)bubble('Seagulls always pick on us!',700,110);
    if(t>37.5&&t<39.8)bubble('Stay in the burrow…',250,320);
  }  else if(t<56){                             // egg theft
    const k=t-40, swoop=prog(t,44,48), away=prog(t,48,55);
    const gx= k<4? lerp(900,300,swoop*0+prog(t,40,44)) : lerp(300,-150,away)*1;
    // phases: hover -> swoop to egg -> carry away right? gull flies off to the right with egg
    let gx2,gy2,hasEgg=t>47;
    if(t<44){gx2=lerp(900,300,prog(t,40,44));gy2=lerp(200,170,prog(t,40,44));}
    else if(t<47){gx2=lerp(300,245,prog(t,44,47));gy2=lerp(170,440,prog(t,44,47));}
    else {gx2=lerp(245,1500,prog(t,47,55));gy2=lerp(440,150,prog(t,47,55));}
    const looking=t<44;
    puffin(110,470,1.3,{bob:Math.sin(t*3)*3,flip:false});
    puffin(380+(t>46?10:0),470,1.3,{flip:true,angry:t>47});
    if(!hasEgg)egg(245,532,1.1);
    gull(gx2,gy2,1.5,{flip:t>=47?false:true,ph:t});
    if(hasEgg)egg(gx2+40,gy2+34,.7);
    if(t>48&&t<54)bubble('MY EGG!!',200,300);
  }
  else if(t<72){                             // chick theft
    const k=t-56;
    const GRAB=63.5;
    if(t<GRAB)chick(245,538,1.1,Math.sin(t*14)*(t>59?4:2));        // chick trembles as the gull dives
    else ell(245,548,24,10,'rgba(0,0,0,.35)');                      // empty nest
    puffin(110,470,1.3,{angry:true,shake:t>62});
    const chase=prog(t,64.4,71.5);                                   // right puffin chases the gull
    const chasing=t>=64.4;
    puffin(lerp(380,1250,chase),470-(chasing?Math.abs(Math.sin(t*9))*26:0),1.3,{flip:!chasing,angry:true});
    let gx,gy;
    if(t<60){gx=lerp(1400,700,prog(t,56,60));gy=180;}
    else if(t<GRAB){gx=lerp(700,383,prog(t,60,GRAB));gy=lerp(180,522,prog(t,60,GRAB));}
    else if(t<64.2){gx=383;gy=522;}
    else {gx=lerp(383,1500,prog(t,64.2,71));gy=lerp(522,110,prog(t,64.2,71));}
    const carrying=t>=GRAB, faceLeft=t<64.2;
    gull(gx,gy,1.5,{flip:faceLeft,ph:t*(t<60||carrying?1:1.6)});
    if(t>=60&&t<GRAB){g.strokeStyle='#e8a43a';g.lineWidth=5;g.beginPath();g.moveTo(gx-6,gy+34);g.lineTo(gx-30,gy+60);g.moveTo(gx+12,gy+34);g.lineTo(gx-10,gy+62);g.stroke();} // talons out
    if(carrying){                                                    // chick dangling from the beak
      const dir=faceLeft?-1:1,sw=Math.sin(t*16)*.35;
      g.save();g.translate(gx+dir*132,gy-8);g.rotate(sw);
      chick(0,34,.9,0);
      ell(-6,34,2,3,'#5ad');ell(14,38,2,3,'#5ad');                  // tears
      g.restore();
      if(t<70)bubble('PEEP PEEP!',gx+dir*132,gy-70);
    }
    if(t>57&&t<62)bubble('Not the baby!',200,300);
    if(t>=66&&t<71)bubble('Come back!!',200,300);
  }
  else if(t<84){                             // angry puffins
    const k=t-72;
    for(let i=0;i<3;i++)puffin(110+i*120,470,1.15,{angry:true,shake:true,flip:false,bob:Math.sin(t*8+i)*4});
    // cartoon fury marks
    g.strokeStyle='#ff5a3a';g.lineWidth=6;
    for(let i=0;i<3;i++){const x=110+i*120;g.beginPath();g.moveTo(x+30,330);g.lineTo(x+50,310);g.moveTo(x+36,345);g.lineTo(x+62,335);g.stroke();}

    puffin(230,455,1.5,{angry:true,shake:true});
    gull(lerp(900,1500,prog(t,84,90)),260-prog(t,84,90)*120,1.4,{flip:false,ph:t});

}

function wrap(txt,max){const ws=txt.split(' ');let line='',out=[];
  for(const w of ws){const tst=line?line+' '+w:w;if(g.measureText(tst).width>max){out.push(line);line=w}else line=tst}
  out.push(line);return out;}
function overlay(t){
  const s=SCENES.find(s=>t>=s.t&&t<s.e)||SCENES[SCENES.length-1];
  const fade=clamp((t-s.t)/.6)*clamp((s.e-t)/.6);
  g.save();g.globalAlpha=Math.max(fade,0);g.textAlign='center';
  if(s.title){
    g.fillStyle='rgba(10,20,34,.6)';g.fillRect(0,0,W,H);
    g.fillStyle='#f4f1e8';g.font='bold 62px "Lilita One","Arial Rounded MT Bold","Segoe UI"';
    const ls=wrap(s.text,1050);ls.forEach((l,i)=>g.fillText(l,W/2,250+i*74));
    g.fillStyle='#f26b1d';g.font='bold 34px "Segoe UI"';g.fillText(s.sub,W/2,250+ls.length*74+30);
  } else {
    g.font='bold 30px "Segoe UI"';const ls=wrap(s.text,1080);
    const h=ls.length*42+24, y0=24;
    g.lineJoin='round';g.lineWidth=7;g.strokeStyle='#fff';g.fillStyle='#f26b1d';
    ls.forEach((l,i)=>{g.strokeText(l,W/2,y0+40+i*42);g.fillText(l,W/2,y0+40+i*42);});
  }
  g.restore();
  // progress bar
  g.fillStyle='rgba(255,255,255,.15)';g.fillRect(0,H-6,W,6);g.fillStyle='#f26b1d';g.fillRect(0,H-6,W*t/DUR,6);
}
function render(t){g.clearRect(0,0,W,H);drawScene(t);particles(t);overlay(t);}

/* ---------- sound (all synthesized, no files) ---------- */
let AC=null,master=null,recDest=null,noiseBuf=null;
function initAudio(){
  if(AC){AC.resume();return;}
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=.7;master.connect(AC.destination);
  recDest=AC.createMediaStreamDestination();master.connect(recDest);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  // ambient waves: looping filtered noise with slow swell
  const n=AC.createBufferSource();n.buffer=noiseBuf;n.loop=true;
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=500;
  const gn=AC.createGain();gn.gain.value=.07;
  const lfo=AC.createOscillator();lfo.frequency.value=.12;const lg=AC.createGain();lg.gain.value=.05;
  lfo.connect(lg);lg.connect(gn.gain);n.connect(lp);lp.connect(gn);gn.connect(master);n.start();lfo.start();
}
function env(node,t0,a,dur,peak){node.gain.setValueAtTime(0,t0);node.gain.linearRampToValueAtTime(peak,t0+a);node.gain.exponentialRampToValueAtTime(.0001,t0+dur);}
function tone(type,f0,f1,dur,peak,vib=0){
  const t0=AC.currentTime,o=AC.createOscillator(),gn=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t0);o.frequency.exponentialRampToValueAtTime(f1,t0+dur);
  if(vib){const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=vib;lg.gain.value=60;l.connect(lg);lg.connect(o.frequency);l.start(t0);l.stop(t0+dur);}
  env(gn,t0,.02,dur,peak);o.connect(gn);gn.connect(master);o.start(t0);o.stop(t0+dur+.05);
}
function noise(dur,f0,f1,peak){
  const t0=AC.currentTime,n=AC.createBufferSource();n.buffer=noiseBuf;
  const bp=AC.createBiquadFilter();bp.type='bandpass';bp.Q.value=2;
  bp.frequency.setValueAtTime(f0,t0);bp.frequency.exponentialRampToValueAtTime(f1,t0+dur);
  const gn=AC.createGain();env(gn,t0,dur*.3,dur,peak);n.connect(bp);bp.connect(gn);gn.connect(master);n.start(t0);n.stop(t0+dur+.05);
}

  flap(){noise(.18,700,300,.18);},
  whale(){tone('sine',160,330,1.8,.1,4);setTimeout(()=>AC&&tone('sine',300,140,1.6,.08,5),900);},
  bark(){tone('square',320,200,.12,.07);setTimeout(()=>AC&&tone('square',340,190,.12,.07),170);},
  splash(){noise(.5,3000,800,.3);},
  hat(){noise(.05,6000,7000,.08);},
  snare(){noise(.15,1800,900,.2);tone('triangle',200,120,.12,.1);},
  chirp(){tone('sine',3000,3800,.08,.04);setTimeout(()=>AC&&tone('sine',3400,4200,.07,.04),110);},
};
const FLY=[[0,10],[24,40],[40,55],[56,71],[72,78],[84,90]];
const EVENTS=[[5,'gull'],[16.5,'peep'],[18,'peep'],[20.5,'peep'],[26,'gull'],[30,'gull'],[34,'gull'],[40.5,'gull'],[42,'swoosh'],
  [44.3,'swoosh'],[47,'pop'],[48,'squawk'],[49.5,'squawk'],[51,'gull'],[56.5,'gull'],[58,'peep'],[59,'swoosh'],[61,'swoosh'],[63.5,'pop'],
  [64.5,'peep'],[65,'gull'],[66,'squawk'],[68,'squawk'],[73,'gull'],[74,'squawk'],[77,'squawk'],[80,'squawk'],[84.5,'gull'],[86,'gull'],
  [10,'whale'],[29.6,'peep'],[33.4,'peep'],[31,'whale'],[53,'whale'],[77,'whale'],[12,'bark'],[28,'bark'],[52,'bark'],[68,'bark'],[36,'splash'],[62,'splash'],[88,'bark'],
  [3,'chirp'],[8,'chirp'],[14,'chirp'],[22,'chirp'],[33,'chirp'],[38,'chirp'],[81,'chirp']];
const CALM=[262,330,392,440,392,330,294,330], TENSE=[220,262,330,262,233,262,330,349];
function musicBeat(beat,tm){
  if(FLY.some(f=>tm>=f[0]&&tm<f[1]))sfx.flap();          // wing flaps while gulls fly
  if(tm>=72&&tm<84){                       // angry: drums + low stab
    if(beat%2===0)sfx.boom();else sfx.snare();
    sfx.hat();tone('sawtooth',110,100,.25,.06);
    if(beat%4===3)tone('sawtooth',165,150,.2,.05);
  } else if(tm>=40&&tm<72){               // tense
    tone('triangle',TENSE[beat%8]/2,TENSE[beat%8]/2,.45,.08);
    tone('sine',TENSE[beat%8]*2,TENSE[beat%8]*2,.2,.03);
    if(beat%4===0)tone('sawtooth',55,55,1.8,.05);       // low drone
    if(beat%2===1)sfx.hat();
  } else {                                // calm / cheerful
    tone('sine',CALM[beat%8],CALM[beat%8],.45,.07);
    tone('triangle',CALM[(beat+3)%8]*2,CALM[(beat+3)%8]*2,.25,.025);
    if(beat%4===0)tone('sine',CALM[beat%8]/2,CALM[beat%8]/2,.9,.06);
    if(beat%2===1)sfx.hat();
  }
}
let prevT=0,prevBeat=-1;
function audioStep(){
  if(!AC||!playing){prevT=t;return;}
  for(const [et,name] of EVENTS)if(prevT<et&&et<=t)sfx[name]();
  const beat=Math.floor(t*2);if(beat!==prevBeat){prevBeat=beat;musicBeat(beat,t);}
  prevT=t;
}

/* ---------- player ---------- */
let t=0,playing=false,last=0,sceneIdx=-1;
const $=id=>document.getElementById(id);
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function tick(now){
  if(playing){t+=(now-last)/1000*rate();
    if(t>=DUR){t=DUR-.001;playing=false;$('play').textContent='↻ Replay';finishRec();}
  }
  audioStep();
  last=now;render(t);
  $('seek').value=t/DUR*1000;$('time').textContent=fmt(realTime(t))+' / '+fmt(realTime(DUR));
  requestAnimationFrame(tick);
}
$('play').onclick=()=>{
  if(t>=DUR-.01){t=0;sceneIdx=-1;}
  playing=!playing;$('play').textContent=playing?'❚❚ Pause':'▶ Play';
  initAudio();prevT=t;prevBeat=Math.floor(t*2)-1;
  if(playing)AC.resume();else AC.suspend();
};
$('seek').oninput=e=>{t=e.target.value/1000*DUR;sceneIdx=-1;prevT=t;prevBeat=Math.floor(t*2)-1;};

/* ---------- record to .webm ---------- */
let rec=null,chunks=[],wake=null;
function finishRec(){if(rec&&rec.state==='recording')rec.stop();}
$('rec').onclick=()=>{
  if(!window.MediaRecorder){alert('Recording is not supported in this browser.');return;}
  initAudio();
  const stream=cv.captureStream(30);chunks=[];
  stream.addTrack(recDest.stream.getAudioTracks()[0]);
  rec=new MediaRecorder(stream,{mimeType:'video/webm',videoBitsPerSecond:5e6});
  rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  rec.onstop=()=>{
    const url=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));
    const a=document.createElement('a');a.href=url;a.download='why-puffins-hate-seagulls.webm';
    document.body.appendChild(a);a.click();                      // try to download automatically
    let box=$('dl');if(!box){box=document.createElement('div');box.id='dl';box.style.cssText='margin-top:12px;padding:14px;background:#1f3a2a;border-radius:10px;font-size:16px';document.querySelector('.bar').after(box);}
    box.innerHTML='✅ Your video is ready! If it did not download by itself, <a style="color:#ffc94a;font-weight:700" href="'+url+'" download="why-puffins-hate-seagulls.webm">click here to download it</a>.';
    $('rec').textContent='⬇ Save as video (.webm)';rec=null;
    try{if(wake){wake.release();wake=null;}}catch(e){}
  };  t=0;sceneIdx=-1;prevT=0;prevBeat=-1;playing=true;AC.resume();
  $('play').textContent='❚❚ Pause';$('rec').textContent='● Recording… (0:57)';rec.start(1000);
  try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(w=>wake=w).catch(()=>{});}catch(e){}
  const old=$('dl');if(old)old.remove();
};
function toggleFS(){
  const w=document.querySelector('.wrap');
  if(document.fullscreenElement){document.exitFullscreen();return;}
  if(w.classList.contains('pseudo-fs')){w.classList.remove('pseudo-fs');$('fs').textContent='⛶ Full screen';return;}
  const enterFallback=()=>{w.classList.add('pseudo-fs');$('fs').textContent='✕ Exit full screen';};   // fills the whole window if the browser blocks real full screen
  try{
    const r=w.requestFullscreen?w.requestFullscreen():(w.webkitRequestFullscreen?w.webkitRequestFullscreen():null);
    if(r&&r.catch)r.catch(enterFallback); else if(!r)enterFallback();
  }catch(e){enterFallback();}
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const w=document.querySelector('.wrap');if(w.classList.contains('pseudo-fs')){w.classList.remove('pseudo-fs');$('fs').textContent='⛶ Full screen';}}});
$('fs').onclick=toggleFS;
cv.ondblclick=toggleFS;
document.addEventListener('keydown',e=>{if(e.key==='f'||e.key==='F')toggleFS();});
requestAnimationFrame(tick);
</script>
